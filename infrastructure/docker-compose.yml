services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citadela}
      POSTGRES_USER: ${POSTGRES_USER:-citadela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citadela-dev-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - citadela-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  citadela-postgres-data:
